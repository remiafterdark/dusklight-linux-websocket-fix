name: Build Linux AppImage (curl with WebSockets)

# The official Linux AppImage is built on Ubuntu 24.04, whose libcurl is 8.5. borealis only builds
# its curl WebSocket backend against libcurl 8.11+ (extern/borealis/CMakeLists.txt), so that build
# has no WebSocket support and room codes do not work. This builds the same v2.0.2 source the same
# way, except that a current libcurl is built from source first - still on Ubuntu 24.04, so the
# AppImage runs anywhere the official one does.

on:
  push:
  workflow_dispatch:

env:
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"
  CURL_VERSION: "8.15.0"

jobs:
  build-linux:
    name: Build Linux (GCC x86_64)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install ninja-build clang lld mold openssl \
            zlib1g-dev libglu1-mesa-dev libdbus-1-dev libvulkan-dev libxi-dev libxrandr-dev libasound2-dev \
            libpulse-dev libudev-dev libpng-dev libncurses5-dev libx11-xcb-dev libfreetype-dev \
            libxinerama-dev libxcursor-dev python3-markupsafe libgtk-3-dev libssl-dev \
            libxss-dev libfuse2 libusb-1.0-0-dev libdecor-0-dev libpipewire-0.3-dev libunwind-dev \
            libnghttp2-dev libpsl-dev
          # Ubuntu's own (8.5) libcurl dev files must not be what CMake finds.
          sudo apt-get -y remove libcurl4-openssl-dev || true

      - name: Build libcurl ${{ env.CURL_VERSION }}
        run: |
          curl -fL "https://curl.se/download/curl-${CURL_VERSION}.tar.xz" -o curl.tar.xz
          tar xf curl.tar.xz
          cd "curl-${CURL_VERSION}"
          ./configure --prefix=/usr/local --with-openssl --with-nghttp2 --enable-websockets \
            --disable-static --disable-manual
          make -j"$(nproc)"
          sudo make install
          sudo ldconfig
          /usr/local/bin/curl-config --version
          /usr/local/bin/curl-config --protocols

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Configure CMake
        run: cmake --preset x-linux-ci-gcc -DCMAKE_PREFIX_PATH=/usr/local

      - name: Check the WebSocket backend was picked up
        run: |
          if grep -rq "src/ws/curl.cpp" build --include=build.ninja; then
            echo "borealis WebSocket backend: curl"
          else
            echo "borealis did not find libcurl 8.11+ - this build would have no room codes"
            exit 1
          fi

      - name: Build
        run: cmake --build --preset x-linux-ci-gcc

      - name: Generate AppImage
        run: ci/build-appimage.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dusklight-v2.0.2-linux-x86_64-websockets
          path: |
            build/install/Dusklight-*.AppImage
